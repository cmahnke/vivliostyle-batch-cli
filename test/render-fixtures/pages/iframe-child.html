<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture: same-origin iframe child (mocked)</title>
    <style>
      body {
        font-family: serif;
        margin: 8px;
      }
    </style>
  </head>
  <body>
    <h1>child mock 42</h1>
    <canvas id="dot" width="200" height="60"></canvas>
    <script>
      var c = document.getElementById("dot");
      var ctx = c.getContext("2d");
      ctx.fillStyle = "#3366cc";
      ctx.fillRect(0, 0, 200, 60);
      ctx.fillStyle = "#fff";
      ctx.font = "20px serif";
      ctx.fillText("child canvas", 10, 38);
    </script>
  </body>
</html>
