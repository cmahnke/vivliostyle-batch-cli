<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture: A-Frame scene + mock model (offline)</title>
    <style>
      @page {
        size: A4;
        margin: 1cm;
      }
      body {
        font-family: serif;
      }
      #stage {
        width: 600px;
        height: 400px;
        break-inside: avoid;
      }
      /* A-Frame sizes its canvas from the scene element's own box
         (offsetWidth/offsetHeight), which is zero for an unsized custom
         element — especially inside paginated viewer layout. */
      #stage a-scene {
        display: block;
        width: 600px;
        height: 400px;
      }
    </style>
    <script src="/vendor/aframe/dist/aframe-master.min.js"></script>
  </head>
  <body>
    <h1>aframe fixture (mocked box + mock model)</h1>
    <div id="stage" class="script">
      <a-scene embedded xr-mode-ui="enabled: false">
        <a-assets>
          <!-- Mocked model: minimal valid GLB (one blue triangle), local file. -->
          <a-asset-item id="mock-model" src="../tiles/aframe/mock.glb"></a-asset-item>
        </a-assets>
        <a-sky color="#f5f5f5"></a-sky>
        <a-box position="0 0.5 -3" width="1" height="1" depth="1" color="#3366cc"></a-box>
        <a-entity gltf-model="#mock-model" position="1.6 0 -3" scale="4 4 4"></a-entity>
      </a-scene>
    </div>
    <p id="aframe-status">loading mocked aframe…</p>
    <script>
      window.__vivFixture = "aframe";
      window.__vivReady = false;
      var sceneEl = document.querySelector("a-scene");
      function ready(which) {
        document.getElementById("aframe-status").textContent = "mock aframe " + which + " 42";
        window.__vivAframeStatus = which;
        window.__vivReady = true;
      }
      if (sceneEl.hasLoaded) ready("already-loaded");
      else
        sceneEl.addEventListener("loaded", function () {
          ready("painted");
        });
      // HiDPI redraw: A-Frame owns the WebGL canvas; ask it to re-fit the
      // container, then scale the backing store. CSS size unchanged.
      window.__vivResize = function (factor) {
        try {
          if (typeof sceneEl.resize === "function") sceneEl.resize();
          var renderer = sceneEl.renderer;
          if (renderer) {
            renderer.setPixelRatio(factor);
            renderer.setSize(600, 400, false);
          }
        } catch (e) {
          /* keep the last good frame */
        }
      };
      setTimeout(function () {
        ready("timeout");
      }, 8000);
    </script>
  </body>
</html>
