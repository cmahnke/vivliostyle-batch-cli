<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture: custom element with data fetch (oxigraph-sparql pattern)</title>
    <style>
      @page {
        size: A4;
        margin: 1cm;
      }
      body {
        font-family: serif;
      }
      data-grid {
        display: block;
        break-inside: avoid;
      }
      data-grid div.row span.id {
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h1>custom element data fixture (oxigraph-sparql pattern)</h1>
    <!-- data-url is an ABSOLUTE url exactly like the blog's
         data-url="https://christianmahnke.de/meta/wikidata/enriched_entities.hdt":
         the harness maps it to a local file via --asset-base. -->
    <data-grid
      id="grid-1"
      data-url="https://fixture.example.test/pages/11-data.json"
      class="script"
      auto-execute
    ></data-grid>
    <p id="grid-status">waiting for data…</p>
    <script>
      window.__vivFixture = "custom-element-data";
      window.__vivReady = false;
    </script>
    <script src="./11-data-grid.js" type="module"></script>
  </body>
</html>
