name: Lint and publish example

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write
  contents: write
  id-token: write
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"
      - run: |
          npm i
          npm run lint
          npm run format
          npm run test
          npx tsc -b --verbose
          npx rollup --config
          npx prettier --check .
          npm run build
      - name: Run publish dry run
        continue-on-error: true
        run: |
          npm publish --dry-run

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"
      - name: Test
        run: |
          npm i
          npm run test

  render-fixtures:
    # End-to-end proof that JS-painted content (canvas, WebGL, iframes, OSD
    # tiles) lands in the PDF and that --pixel-ratio upscales backing pixels.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"
      - run: npm i
      - name: Install Chrome
        # Pinned devDependency (@puppeteer/browsers exposes the `browsers`
        # binary), resolved from node_modules — no registry juggling.
        # Explicit cache dir: v3 would default to ./chrome, while the CLI
        # looks in the puppeteer cache (see src/render/chrome.ts).
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer
        run: npx browsers install chrome@stable
      - run: npm run build
      - name: Render synthetic fixtures to PDF
        run: |
          set -euo pipefail
          CLI="node dist/vivliostyle-batch-cli.js"
          OUT="site/public/fixtures"
          LOGS="/tmp/fixture-logs"
          mkdir -p "$OUT" "$LOGS"
          $CLI -i test/render-fixtures/pages/06-canvas-hires.html -o "$OUT/hires.pdf" \
            --wait-for-content 12000 --pixel-ratio 2 --timeout 120000 2>&1 | tee "$LOGS/hires.log"
          $CLI -i test/render-fixtures/pages/03-echarts.html -o "$OUT/echarts.pdf" \
            --static /vendor/echarts:$PWD/node_modules/echarts \
            --wait-for-content 12000 --pixel-ratio 2 --timeout 120000 2>&1 | tee "$LOGS/echarts.log"
          $CLI -i test/render-fixtures/pages/04-d3.html -o "$OUT/d3.pdf" \
            --static /vendor/d3:$PWD/node_modules/d3 \
            --wait-for-content 12000 --pixel-ratio 2 --timeout 120000 2>&1 | tee "$LOGS/d3.log"
          $CLI -i test/render-fixtures/pages/02-threejs.html -o "$OUT/three.pdf" \
            --static /vendor/three:$PWD/node_modules/three \
            --wait-for-content 12000 --pixel-ratio 2 --timeout 120000 2>&1 | tee "$LOGS/three.log"
          $CLI -i test/render-fixtures/pages/05-openseadragon.html -o "$OUT/osd.pdf" \
            --static /vendor/openseadragon:$PWD/node_modules/openseadragon \
            --static /tiles:$PWD/test/render-fixtures/tiles \
            --wait-for-content 12000 --pixel-ratio 2 --timeout 120000 2>&1 | tee "$LOGS/osd.log"
          $CLI -i test/render-fixtures/pages/01-iframe.html -o "$OUT/iframe.pdf" \
            --wait-for-content 8000 --timeout 120000 2>&1 | tee "$LOGS/iframe.log"
          $CLI -i test/render-fixtures/pages/07-aframe.html -o "$OUT/aframe.pdf" \
            --static /vendor/aframe:$PWD/node_modules/aframe \
            --wait-for-content 12000 --pixel-ratio 2 --timeout 120000 2>&1 | tee "$LOGS/aframe.log"
          $CLI -i test/render-fixtures/pages/08-wasm.html -o "$OUT/wasm.pdf" \
            --static /tiles:$PWD/test/render-fixtures/tiles \
            --wait-for-content 12000 --pixel-ratio 2 --timeout 120000 2>&1 | tee "$LOGS/wasm.log"
      - name: Collect showcase manifest
        # Asserts every marker itself (upscale sizes, frame counts, PDF sizes).
        run: |
          node site/collect-manifest.mjs --out site/public/fixtures --logs /tmp/fixture-logs \
            --commit "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Build showcase site
        run: npm run site:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy-site:
    # Push-gated: PR runs keep the render checks above without publishing.
    if: github.event_name == 'push'
    needs: render-fixtures
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  bun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          rm package-lock.json
          bun install --ignore-scripts
      - name: Run linters
        run: |
          bun run lint
      - name: Run build
        run: |
          bun run build
      - name: Run test
        run: |
          bun run test

  deno:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: |
          deno install
      - name: Run linters
        run: |
          deno run lint
      - name: Run build
        run: |
          deno run build
      - name: Run test
        run: |
          deno run test
